name: test FennecKit

on:
  push:
    branches: ["master"]
    paths:
      - "src/**/*"
  pull_request:
    branches: ["master"]
    paths:
      - "src/**/*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies 🥪
        run: npm install

      - name: Test & check codes 🚧
        run: |
          npm run eslint
          npm run test

      - name: Upload testing report
        uses: actions/upload-artifact@v4
        with:
          name: report_file
          path: ./test/fenneckit.md
